spring.application.name=tesTasks

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# External mock bank base URL (points to local mock controller)
external.bank.base-url=http://localhost:8084/mock/api

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Example OAuth2 client (client credentials) for external bank API.
# Uncomment and fill values to enable OAuth2 for calls to external bank.
#spring.security.oauth2.client.registration.external-bank.client-id=your-client-id
#spring.security.oauth2.client.registration.external-bank.client-secret=your-client-secret
#spring.security.oauth2.client.registration.external-bank.authorization-grant-type=client_credentials
#spring.security.oauth2.client.registration.external-bank.scope=payments accounts
#spring.security.oauth2.client.provider.external-bank.token-uri=https://auth.example.com/oauth2/token

# When OAuth2 is configured, ExternalBankWebClientConfig will create an OAuth-enabled WebClient.

# External bank HTTP client timeouts and retry settings
# Connect timeout in milliseconds
external.bank.connect-timeout-ms=2000
# Response/read timeout in milliseconds
external.bank.response-timeout-ms=5000
# Retry: maximum attempts (including first try). e.g., 3 = 1 initial + 2 retries
external.bank.retry.max-attempts=3
# Retry backoff in milliseconds
external.bank.retry.backoff-ms=500


server.port=8084
mock.file-path=./data/mock-data.json
